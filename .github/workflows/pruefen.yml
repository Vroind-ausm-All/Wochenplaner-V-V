name: Prüfen und Vorschau

# Bei jedem Push: Typprüfung, Tests und Build.
# Vorschau auf GitHub Pages nur von Hand (Actions → „Prüfen und Vorschau“ → „Run workflow“).
# Einmalig nötig: Repository → Settings → Pages → Source auf „GitHub Actions“ stellen.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'workflow_dispatch'
        with:
          path: dist

  vorschau:
    if: github.event_name == 'workflow_dispatch'
    needs: pruefen
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
